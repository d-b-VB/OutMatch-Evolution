name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm Chromium
        run: google-chrome --version
      - run: npm test
      - run: npm run verify:fixtures
      - run: npm run verify:pages
      - name: Upload browser acceptance screenshots
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
